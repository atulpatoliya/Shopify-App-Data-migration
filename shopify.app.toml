# Public (App Store) version of the app.
# Deploy with: npm run deploy
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "bd1b1d070c509ee1e47ee4f68a9815e6"
name = "Bulk Migration & VIP Discounts"
application_url = "https://migration.letvarsolution.com"
embedded = true

[build]
automatically_update_urls_on_dev = false

[webhooks]
api_version = "2026-04"

  [[webhooks.subscriptions]]
  topics = [ "app/scopes_update" ]
  uri = "/webhooks/app/scopes_update"

  [[webhooks.subscriptions]]
  topics = [ "app/uninstalled" ]
  uri = "/webhooks/app/uninstalled"

  [[webhooks.subscriptions]]
  compliance_topics = [ "customers/data_request", "customers/redact", "shop/redact" ]
  uri = "/webhooks/compliance"

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_customers,read_inventory,read_locations,read_products,write_discounts,write_inventory,write_products"
optional_scopes = [ ]
use_legacy_install_flow = false

[auth]
redirect_urls = [
  "https://migration.letvarsolution.com/auth/callback",
  "https://migration.letvarsolution.com/auth"
]
